{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 2px solid var(--border-color); padding-bottom: 12px;">
        <h2 style="margin: 0;">📔 日記記事本</h2>
        <a href="/settings?tab=diary" class="btn btn-primary" style="padding: 8px 16px;">➕ 新增紀錄</a>
    </div>
    
    {% if diaries %}
        <div class="dashboard-grid" style="grid-template-columns: 1fr; gap: 16px;">
            {% for diary in diaries %}
            <div class="card" style="padding: 16px; background-color: var(--bg-color); border: 1px solid var(--border-color); box-shadow: none;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                    <span style="font-size: 1.2em;">
                        {% for i in range(diary.rating) %}⭐{% endfor %}
                    </span>
                    <small style="color: var(--text-muted);">{{ diary.created_at }}</small>
                </div>
                <p style="margin: 0; white-space: pre-wrap; font-size: 1.05em;">{{ diary.feedback }}</p>
            </div>
            {% endfor %}
        </div>
    {% else %}
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            <p style="font-size: 1.2em; margin-bottom: 16px;">您還沒有留下任何穿搭日記喔！</p>
            <a href="/settings?tab=diary" class="btn btn-primary">去寫第一篇日記</a>
        </div>
    {% endif %}
</div>
{% endblock %}
